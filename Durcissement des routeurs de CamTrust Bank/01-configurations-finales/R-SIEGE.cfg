! ==============================================================================
! CamTrust Bank - Routeur Central R-SIEGE (Cisco vIOS)
! Configuration finale durcie - Conformite Politique M1 & Guide NSA
! Etudiant : NGUEGNI ONGOLO Antoine Depadoux | Classe : ITT3 IR
! Remarque : Conformement aux consignes, tous les secrets sont remplaces par <masque>
! ==============================================================================

version 15.6
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone

! [M1.1 / NSA 5.1-5.4] Chiffrement des mots de passe en memoire locale
service password-encryption
security passwords min-length 10

hostname R-SIEGE
boot-start-marker
boot-end-marker

! [M1.3 / NSA 4.1-4.4] Activation du modele AAA et authentification centralisee RADIUS
aaa new-model
aaa authentication login default group radius local
aaa authentication enable default group radius enable
aaa authorization exec default group radius local 
aaa accounting exec default start-stop group radius
aaa accounting commands 15 default start-stop group radius

! [M1.3 / NSA 4.1] Definition du serveur RADIUS central (SRV-ADMIN)
radius server SRV-RADIUS-ADMIN
 address ipv4 10.10.99.20 auth-port 1812 acct-port 1813
 key <masque>

! [M1.1 / NSA 5.1-5.4] Comptes locaux de secours et privilege d'administration
enable secret <masque>
username secours privilege 15 secret <masque>
username admin privilege 15 secret <masque>

! [M1.2 / NSA 7.4] Domaine et generation de cle pour protocole SSHv2
ip domain-name camtrust.lab
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! [M1.5 / NSA 8.2] Controle de spoofing et commutation CEF
ip cef
no ipv6 cef

! [M1.5 / NSA 7.9] Protection contre le brute-force sur les acces interactifs
login block-for 120 attempts 3 within 60
login on-success log
login on-failure log

! [M1.4 / NSA 7.1, 7.9, 7.10] Desactivation des services et protocoles vulnerables
no ip http server
no ip http secure-server
no ip source-route
no ip proxy-arp
no ip finger
no ip bootp server
no service config
no service finger
no service udp-small-servers
no service tcp-small-servers
no cdp run

! [M1.6 / NSA 6.4] Synchronisation temporelle securisee (NTP)
ntp server 10.10.99.20
clock timezone WAT 1 0

! [M1.6 / NSA 6.1-6.3] Journalisation vers serveur Syslog centralise
logging buffered 64000 informational
logging host 10.10.99.20
logging trap informational
logging source-interface GigabitEthernet0/3

! Configuration des interfaces d'interconnexion
interface GigabitEthernet0/0
 description LAN-SIEGE-VERS-SW-SIEGE
 ip address 10.10.10.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 duplex auto
 speed auto
!

interface GigabitEthernet0/1
 description WAN-INTERCONNEXION-VERS-R-FAI
 ip address 198.51.100.2 255.255.255.252
 ! [M1.5 / NSA 8.2] Filtrage anti-usurpation d'adresse source (uRPF mode strict)
 ip verify unicast source reachable-via rx
 no ip redirects
 no ip proxy-arp
 duplex auto
 speed auto
!

interface GigabitEthernet0/2
 description WAN-LIAISON-PRIVEE-VERS-R-DLA
 ip address 172.16.12.1 255.255.255.252
 ip verify unicast source reachable-via rx
 no ip redirects
 no ip proxy-arp
 duplex auto
 speed auto
!

interface GigabitEthernet0/3
 description RESEAU-ADMINISTRATION-ET-SERVEURS
 ip address 10.10.99.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 duplex auto
 speed auto
!

! Routage statique d'infrastructure
ip route 0.0.0.0 0.0.0.0 198.51.100.1
ip route 10.20.10.0 255.255.255.0 172.16.12.2

! [M1.7 / NSA 7.10] Banniere d'avertissement legale avant authentification
banner login ^C
========================================================================
                      CAMTRUST BANK - SYSTEME PRIVE
       Acces strictement reserve aux personnes dument habilitees.
   Toute tentative de connexion non autorisee sera poursuivie (Art. 323).
========================================================================
^C

! [M1.2 / NSA 7.4] Securisation des acces physiques et virtuels (Console et VTY)
line con 0
 exec-timeout 5 0
 login authentication default
 logging synchronous
 transport output none
line aux 0
 no exec
 transport input none
 transport output none
line vty 0 4
 exec-timeout 5 0
 login authentication default
 transport input ssh
 logging synchronous
!

end
